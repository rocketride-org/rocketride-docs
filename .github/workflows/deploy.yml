name: Deploy Docs to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: docs.rocketride.ai
  CLOUDFRONT_ID: E3OODZ66STIMSU

jobs:
  deploy:
    name: Build and Deploy Docusaurus to docs.rocketride.ai
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docusaurus site
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          echo "Deploying to S3 bucket: $S3_BUCKET"
          aws s3 sync build/ s3://$S3_BUCKET/ --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.html"

          aws s3 sync build/ s3://$S3_BUCKET/ \
            --exclude "*" \
            --include "index.html" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "Invalidating CloudFront distribution: $CLOUDFRONT_ID"
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ID \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "Docusaurus site deployed to https://docs.rocketride.ai"
          echo "Build completed at: $(date)"
